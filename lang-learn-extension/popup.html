<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <h1>外语视频学习助手</h1>

    <label class="row"><input type="checkbox" id="enabled"> 启用插件</label>
    <label class="row"><input type="checkbox" id="autoPause"> 自动暂停（逐行字幕暂停）</label>

    <hr>

    <h2>点词查词来源</h2>
    <select id="dictSource">
      <option value="api">在线词典（dictionaryapi.dev，较慢）</option>
      <option value="eudic">本地欧路词典（唤起欧路查词，秒开）</option>
    </select>
    <div id="eudicBox" class="eudicbox">
      <select id="eudicAction" title="唤起欧路词典的窗口类型">
        <option value="lp-dict">迷你查词窗口（推荐）</option>
        <option value="cap-dict">鼠标取词小窗口</option>
        <option value="dict">词典主窗口</option>
      </select>
      <div class="hint show">
        点词会通过 <code>eudic://</code> 唤起本地<b>欧路词典</b>应用查词（支持日语等，需已装对应词库）。<br>
        首次会弹「要打开 欧路词典 吗？」——勾选<b>始终允许</b>后即秒开。<br>
        若没反应：请确认<b>已安装欧路词典</b>（Win 版 ≥ 14.0）。
      </div>
    </div>

    <hr>

    <h2>生词本</h2>
    <div id="vocab" class="vocab"></div>
    <button id="clearVocab" class="clear">清空生词本</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
